apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
  namespace: glpi
spec:
  replicas: 1
  selector: { matchLabels: { app: glpi } }
  template:
    metadata: { labels: { app: glpi } }
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z glpi-db 3306; do echo waiting for db; sleep 2; done;']
      containers:
      - name: glpi
        image: glpi/glpi:11.0-nightly
        ports: [{ containerPort: 80 }]
        volumeMounts:
        - name: glpi-data
          mountPath: /var/www/html/files
          subPath: files
        - name: glpi-data
          mountPath: /var/www/html/config
          subPath: config
      volumes:
      - name: glpi-data
        persistentVolumeClaim: { claimName: glpi-data-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-service
  namespace: glpi
spec:
  type: NodePort
  ports: [{ port: 80, nodePort: 30080 }]
  selector: { app: glpi }