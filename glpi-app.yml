apiVersion: v1
kind: Namespace
metadata:
  name: glpi
---
apiVersion: v1
kind: Secret
metadata:
  name: glpi-db-secrets
  namespace: glpi
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "6i9VSvYCFlPrzf"
  MYSQL_PASSWORD: "6i9VSvYCFlPrzf"
  MYSQL_DATABASE: "glpi"
  MYSQL_USER: "glpi"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-db-pvc
  namespace: glpi
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-files-pvc
  namespace: glpi
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-db
  namespace: glpi
spec:
  replicas: 1
  selector: { matchLabels: { app: glpi-db } }
  template:
    metadata: { labels: { app: glpi-db } }
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_ROOT_PASSWORD } }
        - name: MYSQL_DATABASE
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_DATABASE } }
        - name: MYSQL_USER
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_USER } }
        - name: MYSQL_PASSWORD
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_PASSWORD } }
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
      volumes:
      - name: db-data
        persistentVolumeClaim: { claimName: glpi-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-db
  namespace: glpi
spec:
  ports: [{ port: 3306 }]
  selector: { app: glpi-db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
  namespace: glpi
spec:
  replicas: 1
  selector: { matchLabels: { app: glpi } }
  template:
    metadata: { labels: { app: glpi } }
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z glpi-db 3306; do echo waiting for db; sleep 2; done;']
      containers:
      - name: glpi
        image: glpi/glpi:11.0-nightly
        ports: [{ containerPort: 80 }]
        volumeMounts:
        - name: glpi-files
          mountPath: /var/www/html/files
        - name: glpi-files
          mountPath: /var/www/html/config
      volumes:
      - name: glpi-files
        persistentVolumeClaim: { claimName: glpi-files-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-service
  namespace: glpi
spec:
  type: NodePort
  ports: [{ port: 80, nodePort: 30080 }]
  selector: { app: glpi }