# 1. Database Secrets
apiVersion: v1
kind: Secret
metadata:
  name: glpi-db-secrets
  namespace: glpi
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "6i9VSvYCFlPrzf"
  MYSQL_PASSWORD: "6i9VSvYCFlPrzf"
  MYSQL_DATABASE: "glpi"
  MYSQL_USER: "glpi"
---
# 2. Persistent Storage (Data & DB)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-db-pvc
  namespace: glpi
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-files-pvc
  namespace: glpi
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
# 3. MariaDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-db
  namespace: glpi
spec:
  replicas: 3
  selector: { matchLabels: { app: glpi-db } }
  template:
    metadata: { labels: { app: glpi-db } }
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_ROOT_PASSWORD } }
        - name: MYSQL_DATABASE
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_DATABASE } }
        - name: MYSQL_USER
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_USER } }
        - name: MYSQL_PASSWORD
          valueFrom: { secretKeyRef: { name: glpi-db-secrets, key: MYSQL_PASSWORD } }
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
      volumes:
      - name: db-data
        persistentVolumeClaim: { claimName: glpi-db-pvc }
---
# 4. MariaDB Service
apiVersion: v1
kind: Service
metadata:
  name: glpi-db
  namespace: glpi
spec:
  ports: [{ port: 3306 }]
  selector: { app: glpi-db }
---
# 5. GLPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
  namespace: glpi
spec:
  replicas: 3
  selector: { matchLabels: { app: glpi } }
  template:
    metadata: { labels: { app: glpi } }
    spec:
      containers:
      - name: glpi
        image: glpi-project/glpi:latest
        ports: [{ containerPort: 80 }]
        volumeMounts:
        - name: glpi-files
          mountPath: /var/www/html/files
        - name: glpi-config
          mountPath: /var/www/html/config
      volumes:
      - name: glpi-files
        persistentVolumeClaim: { claimName: glpi-files-pvc }
      - name: glpi-config
        persistentVolumeClaim: { claimName: glpi-files-pvc } # Simplification: sharing PVC for config/files
---
# 6. GLPI Service
apiVersion: v1
kind: Service
metadata:
  name: glpi-service
  namespace: glpi
spec:
  type: NodePort
  ports: [{ port: 80, nodePort: 30080 }]
  selector: { app: glpi }