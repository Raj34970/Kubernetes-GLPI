---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-db-glpi
  labels:
    type: local
spec:
  storageClassName: glpi-db-volume
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/db"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-data-glpi
  labels:
    type: local
spec:
  storageClassName: glpi-data-volume
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data"   
