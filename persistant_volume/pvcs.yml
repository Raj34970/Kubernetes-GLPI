apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-db-pvc
  namespace: glpi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: glpi-db-volume
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-data-pvc
  namespace: glpi
spec:
  accessModes: [ReadWriteMany]
  storageClassName: glpi-data-volume
  resources: { requests: { storage: 10Gi } }